# ===============================
# PostgreSQL Database
# ===============================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/medical_app}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# JWT Security
# ===============================
jwt.secret=${JWT_SECRET:dev-only-secret-key-change-before-deployment-123456789}
jwt.expiration=7200000

# ===============================
# Server
# ===============================
server.port=${PORT:8080}

# ===============================
# Flask Prediction API
# ===============================
flask.api.url=${FLASK_API_URL:http://localhost:5000}

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.com.medicalapp=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN